# Corne 2.1 wired TRRS configuration
# Preserve Azoteq IQS5xx support and remove Bluetooth
CONFIG_ZMK_SLEEP=n
CONFIG_PM_DEVICE=y
CONFIG_ZMK_EXT_POWER=y

# Enable Azoteq trackpad and mouse support (right half)
CONFIG_ZMK_MOUSE=y
CONFIG_INPUT=y
CONFIG_INPUT_AZOTEQ_IQS5XX=y
CONFIG_ZMK_SPLIT=y

# Wired split transport will use serial on D2 (mapped to pro_micro 2) — adjust if different
# Note: further Kconfig flags for split-serial may be required by your build environment.

# Bluetooth removed
# CONFIG_BT_BAS=n
# CONFIG_ZMK_BATTERY_REPORTING=n
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=n

#Bluetooth settings (disabled)
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=n
CONFIG_I2C=y
